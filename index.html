<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c2117">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="야구 점수판">
<title>야구 점수판</title>
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); box-sizing: border-box; }
body { margin: 0; }
[hidden] { display: none !important; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Chakra+Petch:wght@500;700&family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
<style>
/* Layout: ballpark scoreboard in one committed dark-green look. Phone: score → count/diamond → controls → line score.
   Wide/landscape: two columns (score + line score | count + controls). B/S/O lamps use the stadium convention green/yellow/red. */
:root {
  color-scheme: dark;
  --bg: #0c2117;
  --board: #123020;
  --board-2: #0f281b;
  --line: #24503a;
  --fg: #f3efe2;
  --muted: #9db8a6;
  --amber: #ffc93c;
  --lamp-b: #3ddc84;
  --lamp-s: #ffc93c;
  --lamp-o: #ff5148;
  --lamp-off: #1b3c2b;
  --f-display: "Black Han Sans", "IBM Plex Sans KR", system-ui, sans-serif;
  --f-num: "Chakra Petch", ui-monospace, "SF Mono", monospace;
  --f-ui: "IBM Plex Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif;
  --gutter: clamp(16px, 2vw, 28px);
  --r: 14px;
}
html, body { min-height: 100%; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--f-ui); font-size: 15px;
  padding-inline: var(--gutter); padding-block: 12px;
  box-sizing: border-box;
  display: flex; flex-direction: column; gap: 12px;
  -webkit-tap-highlight-color: transparent; user-select: none;
}
*, *::before, *::after { box-sizing: inherit; }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
button:disabled { opacity: .35; cursor: not-allowed; }

/* Top bar */
.bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.brand { font-family: var(--f-display); font-size: 1.15rem; margin-right: auto; }
.inning {
  display: flex; align-items: center; gap: 8px; padding: 4px 16px;
  border: 1px solid var(--line); border-radius: 999px; background: var(--board);
  font-family: var(--f-display); font-size: 1.25rem; color: var(--amber);
}
.inning .arrow { font-size: .8rem; }
.tools { display: flex; gap: 6px; flex-wrap: wrap; }
.tbtn {
  background: var(--board); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 12px; font-size: .9rem; font-weight: 600; min-height: 40px;
}
.tbtn:hover:not(:disabled) { border-color: var(--muted); }
.tbtn.off { color: var(--muted); text-decoration: line-through; }
.tbtn.armed { background: var(--lamp-o); border-color: var(--lamp-o); color: #fff; }
.tbtn kbd { font-family: var(--f-num); font-size: .7rem; color: var(--muted); margin-left: 4px; }
.status { font-size: .88rem; color: var(--muted); min-height: 1.3em; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.status b { color: var(--fg); font-weight: 600; }

/* Main grid */
.layout { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); grid-template-areas: "score" "count" "ctrls" "line"; }
@media (min-width: 900px), (orientation: landscape) and (min-width: 640px) {
  .layout { grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); grid-template-areas: "score count" "line ctrls"; align-items: start; }
}
.panel { background: var(--board); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; min-width: 0; }

/* Team scores */
.scores { grid-area: score; display: grid; gap: 8px; }
.trow {
  --c: #888; display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 14px; align-items: center;
  padding: 8px 14px 8px 8px; border-radius: 12px; background: var(--board-2); border: 2px solid transparent;
}
.trow .stripe { align-self: stretch; border-radius: 6px; background: var(--c); }
.trow .who { min-width: 0; display: grid; gap: 4px; }
.trow .name { font-family: var(--f-display); font-size: clamp(1.3rem, 4.5vw, 2.4rem); line-height: 1.05; overflow-wrap: anywhere; }
.trow .meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: .8rem; color: var(--muted); }
.trow .atbat { display: none; background: var(--amber); color: #1d1600; font-weight: 600; font-size: .72rem; padding: 2px 8px; border-radius: 999px; letter-spacing: .04em; }
.trow.batting { border-color: var(--amber); }
.trow.batting .atbat { display: inline-block; }
.trow .runs { font-family: var(--f-num); font-weight: 700; font-variant-numeric: tabular-nums; font-size: clamp(3.4rem, 13vw, 7.5rem); line-height: .9; min-width: 1.2ch; text-align: right; }
.runs.bump { animation: bump .3s ease-out; }
@keyframes bump { 0% { transform: scale(1.12); color: var(--amber); } 100% { transform: scale(1); } }

/* Count + diamond */
.countbox { grid-area: count; display: flex; flex-wrap: wrap; gap: 18px; align-items: center; justify-content: space-around; }
.lamps { display: grid; gap: 10px; }
.lrow { display: grid; grid-template-columns: 1.6em auto; align-items: center; gap: 10px; }
.lrow .k { font-family: var(--f-num); font-weight: 700; font-size: clamp(1.3rem, 4vw, 1.9rem); color: var(--muted); }
.dots { display: flex; gap: 8px; }
.dot {
  --on: var(--lamp-b);
  width: clamp(30px, 7vw, 44px); aspect-ratio: 1; border-radius: 50%; padding: 0;
  background: var(--lamp-off); border: 2px solid #0a1d13; box-shadow: inset 0 2px 6px rgb(0 0 0 / .45);
  transition: background .12s, box-shadow .12s;
}
.dot.on { background: var(--on); box-shadow: 0 0 14px color-mix(in srgb, var(--on) 70%, transparent), inset 0 -3px 6px rgb(0 0 0 / .25); }
.lrow[data-k="strikes"] .dot { --on: var(--lamp-s); }
.lrow[data-k="outs"] .dot { --on: var(--lamp-o); }

.diamond { position: relative; width: clamp(180px, 50vw, 270px); aspect-ratio: 1; max-width: 100%; }
@media (min-width: 900px), (orientation: landscape) and (min-width: 640px) { .diamond { width: clamp(180px, 22vw, 270px); } }
.base::after { content: attr(data-label); position: absolute; inset: 0; display: grid; place-items: center; transform: rotate(-45deg); font-family: var(--f-num); font-weight: 700; font-size: clamp(.8rem, 2.4vw, 1.05rem); color: var(--muted); }
.base[aria-pressed="true"]::after { color: #1d1600; }
.diamond::before {
  content: ""; position: absolute; left: 21%; top: 21%; width: 58%; height: 58%;
  transform: rotate(45deg); border: 2px dashed color-mix(in srgb, var(--fg) 25%, transparent); border-radius: 4px;
}
.base {
  position: absolute; width: 26%; aspect-ratio: 1; padding: 0;
  transform: rotate(45deg); border-radius: 4px;
  background: var(--board-2); border: 3px solid color-mix(in srgb, var(--fg) 55%, transparent);
}
.base[aria-pressed="true"] { background: var(--amber); border-color: var(--amber); box-shadow: 0 0 16px color-mix(in srgb, var(--amber) 60%, transparent); }
.base[data-b="1"] { left: 37%; top: 4%; }
.base[data-b="0"] { left: 70%; top: 37%; }
.base[data-b="2"] { left: 4%; top: 37%; }
.home {
  position: absolute; left: 41%; top: 74%; width: 18%; aspect-ratio: 1;
  background: color-mix(in srgb, var(--fg) 75%, transparent);
  clip-path: polygon(0 0, 100% 0, 100% 55%, 50% 100%, 0 55%);
}
.dhint { width: 100%; text-align: center; font-size: .75rem; color: var(--muted); margin: -8px 0 0; }

/* Controls */
.ctrls { grid-area: ctrls; display: grid; gap: 8px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.act {
  --k: var(--muted);
  min-height: clamp(62px, 10vh, 92px); border-radius: 12px;
  border: 2px solid var(--k); background: color-mix(in srgb, var(--k) 16%, var(--board-2));
  font-family: var(--f-display); font-size: clamp(1.1rem, 3.6vw, 1.6rem); line-height: 1.1;
  display: grid; place-content: center; gap: 2px; text-align: center;
}
.act small { font-family: var(--f-num); font-size: .68rem; color: var(--muted); }
.act:active:not(:disabled) { background: color-mix(in srgb, var(--k) 35%, var(--board-2)); }
.act.ball { --k: var(--lamp-b); }
.act.strike { --k: var(--lamp-s); }
.act.out { --k: var(--lamp-o); }
.act.run { --k: var(--amber); background: var(--amber); color: #1d1600; }
.act.run small { color: #5a4600; }
.act.read { --k: var(--fg); grid-column: 1 / -1; min-height: 56px; font-size: clamp(1.05rem, 3.4vw, 1.35rem); }
.act.read.speaking { background: color-mix(in srgb, var(--fg) 30%, var(--board-2)); }
.act.minor { min-height: 46px; font-family: var(--f-ui); font-weight: 600; font-size: .92rem; }
@media (hover: none) { .act small, .tbtn kbd, .hint { display: none; } }

/* Line score */
.linewrap { grid-area: line; overflow-x: auto; padding: 0; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: 10px 8px; text-align: center; font-family: var(--f-num); font-weight: 700; font-size: 1.05rem; border-bottom: 1px solid var(--line); white-space: nowrap; }
thead th { font-size: .78rem; color: var(--muted); font-weight: 500; letter-spacing: .06em; }
tbody tr:last-child td, tbody tr:last-child th { border-bottom: 0; }
th.tn { text-align: left; font-family: var(--f-ui); font-weight: 600; font-size: .92rem; padding-left: 14px; position: sticky; left: 0; background: var(--board); max-width: 9em; overflow: hidden; text-overflow: ellipsis; }
th.tn i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 8px; vertical-align: 0; }
td.cur { background: color-mix(in srgb, var(--amber) 22%, transparent); color: var(--amber); }
td.tot { color: var(--amber); border-left: 1px solid var(--line); }
td.tot + td { color: var(--muted); }
thead th.ccol { color: var(--amber); }

.hint { font-size: .8rem; color: var(--muted); }

/* Overlays */
.sheet-wrap { position: fixed; inset: 0; background: rgb(0 0 0 / .62); display: grid; place-items: center; padding: 16px; z-index: 10; }
.sheet { width: min(460px, 100%); background: var(--board); border: 1px solid var(--line); border-radius: 16px; padding: 20px; display: grid; gap: 14px; max-height: 100%; overflow: auto; }
.sheet h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 1.4rem; }
.final { text-align: center; border-color: var(--amber); border-width: 2px; }
.final .eyebrow { font-family: var(--f-num); color: var(--amber); letter-spacing: .16em; font-size: .8rem; }
.final .big { font-family: var(--f-num); font-weight: 700; font-size: clamp(3rem, 14vw, 5rem); line-height: 1; }
.final .row { justify-content: center; }
.field { display: grid; gap: 6px; }
.field > label { font-size: .8rem; color: var(--muted); letter-spacing: .04em; }
.field input[type=number], .teamset input:not([type=color]) { font: inherit; font-size: 1rem; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; }
.note { font-size: .8rem; color: var(--muted); margin: 0; line-height: 1.5; }
.row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: space-between; }
.primary { background: var(--amber); color: #1d1600; border: 0; border-radius: 10px; padding: 12px 18px; font-weight: 700; min-height: 46px; }
.danger { background: transparent; border: 1px solid #e05656; color: #ff9b9b; border-radius: 10px; padding: 10px 14px; font-weight: 600; }
.danger.armed { background: #e05656; color: #fff; }
.presets { display: flex; flex-wrap: wrap; gap: 6px; }
.presets button { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; min-width: 52px; min-height: 42px; font-family: var(--f-num); font-weight: 700; font-size: 1.05rem; }
.presets.ko button { font-family: var(--f-ui); font-size: .88rem; font-weight: 600; padding: 0 12px; }
.presets button[aria-pressed="true"] { background: var(--amber); color: #1d1600; border-color: var(--amber); }
.stepper { display: flex; gap: 6px; }
.stepper button { width: 46px; flex: none; }
.stepper input { text-align: center; font-family: var(--f-num); font-weight: 700; font-size: 1.2rem; }
.soundrow { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.soundrow input[type=range] { flex: 1; min-width: 120px; accent-color: var(--amber); }
.teamset { display: grid; gap: 8px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); }
.teamset-top { display: flex; gap: 10px; align-items: center; }
.teamset-top .pv { flex: none; width: 40px; height: 40px; border-radius: 10px; box-shadow: inset 0 0 0 1px var(--line); }
.teamset-top .lbl { flex: none; font-size: .78rem; color: var(--muted); width: 2.6em; }
.swatches { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.sw { width: 30px; height: 30px; border-radius: 50%; border: 2px solid transparent; box-shadow: inset 0 0 0 1px rgb(255 255 255 / .18); padding: 0; }
.sw[aria-pressed="true"] { border-color: var(--amber); outline: 2px solid var(--bg); outline-offset: -4px; }
.custom { position: relative; width: 30px; height: 30px; border-radius: 50%; overflow: hidden; border: 1px dashed var(--muted); display: grid; place-items: center; color: var(--muted); }
.custom input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; padding: 0; border: 0; }

@media (prefers-reduced-motion: reduce) { .runs.bump { animation: none; } * { transition: none !important; } }
</style>
</head>
<body>
<header class="bar">
  <div class="brand">야구 점수판</div>
  <div class="inning" aria-live="polite"><span class="arrow" id="arrow">▲</span><span id="inningLabel">1회 초</span></div>
  <div class="tools">
    <button class="tbtn" id="soundBtn" type="button">소리<kbd>M</kbd></button>
    <button class="tbtn" id="undoBtn" type="button">되돌리기<kbd>Z</kbd></button>
    <button class="tbtn" id="quickReset" type="button">초기화</button>
    <button class="tbtn" id="setBtn" type="button">설정</button>
    <button class="tbtn" id="fsBtn" type="button">전체화면</button>
  </div>
</header>
<div class="status" id="status" aria-live="polite"></div>

<main class="layout">
  <section class="scores" aria-label="팀 점수">
    <div class="trow" id="row0"><span class="stripe"></span><div class="who"><span class="name"></span><span class="meta"><span class="atbat">공격</span><span class="side">원정 · 초 공격</span></span></div><span class="runs">0</span></div>
    <div class="trow" id="row1"><span class="stripe"></span><div class="who"><span class="name"></span><span class="meta"><span class="atbat">공격</span><span class="side">홈 · 말 공격</span></span></div><span class="runs">0</span></div>
  </section>

  <section class="panel countbox" aria-label="카운트와 주자">
    <div class="lamps">
      <div class="lrow" data-k="strikes"><span class="k">S</span><div class="dots"></div></div>
      <div class="lrow" data-k="outs"><span class="k">O</span><div class="dots"></div></div>
    </div>
    <div class="diamond">
      <button class="base" type="button" data-b="1" data-label="2" aria-label="2루 주자"></button>
      <button class="base" type="button" data-b="2" data-label="3" aria-label="3루 주자"></button>
      <button class="base" type="button" data-b="0" data-label="1" aria-label="1루 주자"></button>
      <span class="home"></span>
    </div>
    <p class="dhint">베이스를 눌러 주자를 표시하거나 지우세요</p>
  </section>

  <section class="ctrls" aria-label="기록 버튼">
    <button class="act strike" type="button" data-a="strike">스트라이크<small>S</small></button>
    <button class="act out" type="button" data-a="out">아웃<small>O</small></button>
    <button class="act run" type="button" data-a="run">득점 +1<small>R</small></button>
    <button class="act minor" type="button" data-a="runMinus">득점 −1</button>
    <button class="act minor" type="button" data-a="change">공수 교대</button>
    <button class="act minor" type="button" data-a="clearCount">다음 타자</button>
    <button class="act read" type="button" id="readBtn">스코어 읽어주기<small>V</small></button>
  </section>

  <section class="panel linewrap" aria-label="이닝별 점수">
    <table id="lineTable"></table>
  </section>
</main>

<footer class="hint">키보드: S 스트라이크 · O 아웃 · R 득점 · 1·2·3 주자 · V 스코어 읽기 · Z 되돌리기 · M 소리</footer>

<div class="sheet-wrap" id="finalWrap" hidden>
  <div class="sheet final">
    <span class="eyebrow">GAME SET</span>
    <h2 id="finalWinner"></h2>
    <div class="big" id="finalScore"></div>
    <p class="note" id="finalNote"></p>
    <div class="row">
      <button class="tbtn" id="finalUndo" type="button">되돌리기</button>
      <button class="tbtn" id="finalClose" type="button">점수판 보기</button>
      <button class="primary" id="finalNew" type="button">새 경기</button>
    </div>
  </div>
</div>

<div class="sheet-wrap" id="sheet" hidden>
  <form class="sheet" id="setForm">
    <h2>경기 설정</h2>
    <div class="field">
      <label for="innings">정규 이닝 수</label>
      <div class="presets" id="innPresets"></div>
      <div class="stepper">
        <button class="tbtn" type="button" id="iMinus" aria-label="이닝 1 줄이기">−</button>
        <input id="innings" type="number" min="1" max="15" inputmode="numeric">
        <button class="tbtn" type="button" id="iPlus" aria-label="이닝 1 늘리기">+</button>
      </div>
      <p class="note">정규 이닝이 끝났을 때 동점이면 연장으로 이어집니다. 마지막 이닝 말에 홈팀이 앞서는 순간 경기가 끝납니다.</p>
    </div>
    <div class="field">
      <label>팀 이름과 색상</label>
      <div class="teamset" id="ts0"></div>
      <div class="teamset" id="ts1"></div>
    </div>
    <div class="field">
      <label>소리 · 막대는 효과음 크기</label>
      <div class="soundrow">
        <button class="tbtn" type="button" id="sndToggle">켜짐</button>
        <input type="range" id="vol" min="0" max="100" step="5" aria-label="음량">
      </div>
      <label>음성 안내 · 스트라이크, 아웃, 공수 교대를 읽어줍니다</label>
      <div class="soundrow">
        <button class="tbtn" type="button" id="voiceToggle">켜짐</button>
        <button class="tbtn" type="button" id="voiceTest">미리 듣기</button>
      </div>
      <label>목소리 · 눌러서 들어보고 가장 또렷한 걸 고르세요</label>
      <div class="presets ko" id="voiceList"></div>
      <label>음성 속도</label>
      <div class="presets ko" id="rateSnd"></div>
      <label>음성 높이 · 야외 스피커에서는 높을수록 잘 들립니다</label>
      <div class="presets ko" id="pitchSnd"></div>
      <p class="note">음성은 기기가 낼 수 있는 최대 크기로 나옵니다. 위 음량 막대는 효과음에만 적용돼요. 효과음을 낮추면 음성이 더 또렷하게 들립니다.</p>
      <label>득점 소리 · 눌러서 미리 듣기</label>
      <div class="presets ko" id="runSnd"></div>
    </div>
    <div class="row">
      <button class="danger" id="resetBtn" type="button">새 경기 시작</button>
      <div class="tools">
        <button class="tbtn" id="closeBtn" type="button">닫기</button>
        <button class="primary" type="submit">저장</button>
      </div>
    </div>
  </form>
</div>

<script>
(() => {
  const KEY = 'baseball-scoreboard-v1', PKEY = 'baseball-sound-v1';
  const PALETTE = [
    ['파랑', '#2f6fe4'], ['빨강', '#e23b3b'], ['남색', '#1e3a8a'], ['초록', '#22a45d'],
    ['노랑', '#ffd23f'], ['주황', '#ff8a2a'], ['보라', '#8b5cf6'], ['하늘', '#38bdf8'],
    ['핑크', '#ff3f8e'], ['검정', '#08080a'], ['회색', '#a3a9b4'], ['흰색', '#f4f4f2']
  ];

      $('finalWinner').textContent = `${s.names[w]} 승리!`;
      $('finalScore').textContent = `${tots[0]} : ${tots[1]}`;
      $('finalNote').textContent = `${s.names[0]} ${tots[0]} · ${s.names[1]} ${tots[1]} · ${s.inning}회${s.inning > s.innings ? ' (연장)' : ''}`;
      $('finalWrap').hidden = false;
    } else $('finalWrap').hidden = true;
    if (!s.over) finalDismissed = false;
  }
  let finalDismissed = false;
  $('finalUndo').onclick = () => { finalDismissed = false; undo(); };
  $('finalClose').onclick = () => { finalDismissed = true; $('finalWrap').hidden = true; };
  $('finalNew').onclick = () => {
    commit(() => { const n = s.names, c = s.colors, i = s.innings; s = fresh(n, c, i); s.last = '<b>새 경기</b> · 되돌리기로 이전 경기를 복구할 수 있습니다'; return 'change'; });
  };

  // ---------- Sound controls ----------
  function renderSound() {
    $('soundBtn').classList.toggle('off', !prefs.on);
    $('soundBtn').firstChild.textContent = prefs.on ? '소리' : '소리 꺼짐';
    $('sndToggle').textContent = prefs.on ? '켜짐' : '꺼짐';
    $('sndToggle').classList.toggle('off', !prefs.on);
    $('vol').value = prefs.vol;
    $('runSnd').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.k === prefs.run)));
    $('voiceToggle').textContent = prefs.voice ? '켜짐' : '꺼짐';
    $('voiceToggle').classList.toggle('off', !prefs.voice);
    $('rateSnd').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.r === prefs.rate)));
    $('pitchSnd').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.p === prefs.pitch)));
  }
  $('voiceList').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    koVoice = koVoices[+b.dataset.v]; prefs.voiceName = koVoice.name; savePrefs(); renderVoices();
    speak('투 스트라이크! 원 아웃!', true);
  });
  renderVoices();
  $('pitchSnd').innerHTML = [[1, '보통'], [1.4, '높게'], [1.8, '아주 높게'], [2, '최고']].map(([p, nm]) => `<button type="button" data-p="${p}">${nm}</button>`).join('');
  $('pitchSnd').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    prefs.pitch = +b.dataset.p; savePrefs(); renderSound(); speak('투 스트라이크! 원 아웃!', true);
  });
  $('rateSnd').innerHTML = [[.9, '천천히'], [1, '보통'], [1.15, '또박또박 빠르게'], [1.3, '아주 빠르게']].map(([r, nm]) => `<button type="button" data-r="${r}">${nm}</button>`).join('');
  $('rateSnd').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    prefs.rate = +b.dataset.r; savePrefs(); renderSound(); speak('투 스트라이크! 원 아웃!', true);
  });
  $('voiceToggle').onclick = () => { prefs.voice = !prefs.voice; savePrefs(); renderSound(); if (prefs.voice) speak('음성 안내를 켰습니다', true); };
  $('voiceTest').onclick = () => {
    if (!synth) { $('voiceTest').textContent = '이 브라우저는 음성 미지원'; return; }
    speak('투 스트라이크! 원 아웃!', true);
  };
  function toggleSound() { prefs.on = !prefs.on; savePrefs(); renderSound(); if (prefs.on) play('tick'); else { try { synth && synth.cancel(); } catch (e) {} } }
  $('runSnd').innerHTML = '<button type="button" data-k="random">랜덤</button>' +
    Object.entries(RUN_SOUNDS).map(([k, [nm]]) => `<button type="button" data-k="${k}">${nm}</button>`).join('');
  $('runSnd').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    prefs.run = b.dataset.k; savePrefs(); renderSound(); play(b.dataset.k === 'random' ? 'run' : b.dataset.k, true);
  });
  $('vol').addEventListener('input', e => { prefs.vol = +e.target.value; savePrefs(); });
  $('vol').addEventListener('change', () => play('ball', true));
  $('sndToggle').onclick = toggleSound;
  $('soundBtn').onclick = toggleSound;

  // ---------- Settings ----------
  const sheet = $('sheet'), resetBtn = $('resetBtn');
  let draftColors = [];
  $('innPresets').innerHTML = INNING_PRESETS.map(n => `<button type="button" data-n="${n}">${n}</button>`).join('');
  const syncInn = () => { const v = parseInt($('innings').value, 10); $('innPresets').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.n === v))); };
  $('innPresets').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { $('innings').value = b.dataset.n; syncInn(); } });
  const stepI = d => { $('innings').value = Math.max(1, Math.min(15, (parseInt($('innings').value, 10) || s.innings) + d)); syncInn(); };
  $('iMinus').onclick = () => stepI(-1); $('iPlus').onclick = () => stepI(1);
  $('innings').addEventListener('input', syncInn);

  [0, 1].forEach(i => {
    $('ts' + i).innerHTML = `
      <div class="teamset-top"><span class="pv" id="pv${i}"></span><span class="lbl">${i ? '홈' : '원정'}</span><input id="n${i}" maxlength="10" aria-label="${i ? '홈' : '원정'} 팀 이름"></div>
      <div class="swatches" role="group" aria-label="${i ? '홈' : '원정'} 팀 색상">
        ${PALETTE.map(([nm, hex]) => `<button type="button" class="sw" data-c="${hex}" style="background:${hex}" title="${nm}" aria-label="${nm}"></button>`).join('')}
        <label class="custom" title="직접 고르기">＋<input type="color" id="cc${i}" aria-label="색상 직접 고르기"></label>
      </div>`;
    $('ts' + i).querySelector('.swatches').addEventListener('click', e => { const b = e.target.closest('.sw'); if (b) setDraft(i, b.dataset.c); });
    $('cc' + i).addEventListener('input', e => setDraft(i, e.target.value));
  });
  function setDraft(i, hex) {
    draftColors[i] = hex; $('pv' + i).style.background = hex; $('cc' + i).value = hex;
    $('ts' + i).querySelectorAll('.sw').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.c.toLowerCase() === hex.toLowerCase())));
  }
  function openSheet() {
    draftColors = s.colors.slice();
    [0, 1].forEach(i => { $('n' + i).value = s.names[i]; setDraft(i, s.colors[i]); });
    $('innings').value = s.innings; syncInn(); renderSound();
    resetBtn.classList.remove('armed'); resetBtn.textContent = '새 경기 시작';
    sheet.hidden = false; $('n0').focus();
  }
  const closeSheet = () => { sheet.hidden = true; };
  $('setBtn').onclick = openSheet; $('closeBtn').onclick = closeSheet;
  sheet.addEventListener('click', e => { if (e.target === sheet) closeSheet(); });
  $('setForm').addEventListener('submit', e => {
    e.preventDefault();
    const names = [0, 1].map(i => $('n' + i).value.trim() || s.names[i]);
    const inn = Math.max(1, Math.min(15, parseInt($('innings').value, 10) || s.innings));
    const colors = draftColors.slice();
    commit(() => { s.names = names; s.colors = colors; s.innings = inn; s.last = `<b>설정 변경</b> · ${inn}이닝 경기`; return 'tick'; });
    closeSheet();
  });
  resetBtn.onclick = () => {
    if (!resetBtn.classList.contains('armed')) { resetBtn.classList.add('armed'); resetBtn.textContent = '한 번 더 누르면 초기화'; return; }
    commit(() => { const n = s.names, c = s.colors, i = s.innings; s = fresh(n, c, i); s.last = '<b>새 경기</b> · 되돌리기로 이전 경기를 복구할 수 있습니다'; return 'change'; });
    closeSheet();
  };

  // ---------- Toolbar, keyboard, wake ----------
  $('undoBtn').onclick = undo;
  $('readBtn').onclick = readScore;
  let armTimer = null;
  const qr = $('quickReset');
  function disarm() { clearTimeout(armTimer); qr.classList.remove('armed'); qr.textContent = '초기화'; }
  qr.onclick = () => {
    if (!qr.classList.contains('armed')) {
      qr.classList.add('armed'); qr.textContent = '한 번 더 누르면 초기화';
      armTimer = setTimeout(disarm, 3000); return;
    }
    disarm(); finalDismissed = false;
    commit(() => { const n = s.names, c = s.colors, i = s.innings; s = fresh(n, c, i); s.last = '<b>초기화</b> · 0 : 0 새 경기 · 실수였다면 되돌리기를 누르세요'; say = '새 경기를 시작합니다. 1회 초'; return 'change'; });
  };
  $('fsBtn').onclick = () => {
    try { if (document.fullscreenElement) document.exitFullscreen?.(); else document.documentElement.requestFullscreen?.().catch(() => {}); } catch (e) {}
  };
  document.addEventListener('fullscreenchange', () => { $('fsBtn').textContent = document.fullscreenElement ? '창 모드' : '전체화면'; });
  const KEYS = { s: 'strike', o: 'out', r: 'run', n: 'clearCount' };
  document.addEventListener('keydown', e => {
    if (!sheet.hidden) { if (e.key === 'Escape') closeSheet(); return; }
    if (e.target.closest('input') || e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key.toLowerCase();
    if (KEYS[k]) { e.preventDefault(); act(KEYS[k]); }
    else if (['1', '2', '3'].includes(k)) toggleBase(+k - 1);
    else if (k === 'v') readScore();
    else if (k === 'z') { e.preventDefault(); undo(); }
    else if (k === 'm') toggleSound();
  });
  let lock = null;
  async function wake() { try { if (!lock && navigator.wakeLock) { lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release', () => lock = null); } } catch (e) {} }
  document.addEventListener('pointerdown', wake, { once: true });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') wake(); });

  render(); renderSound();
})();
</script>
</body>
</html>
